# IRSA: each service account assumes its own IAM role (Terraform output
# workload_role_arns). Replace the account id before deploying.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feature-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/mlplat-dev-feature-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/mlplat-dev-model-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jobs-worker
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/mlplat-dev-jobs-worker
