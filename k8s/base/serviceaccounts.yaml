# One service account per workload. The dev overlay adds the
# eks.amazonaws.com/role-arn annotation that maps each one to its own IAM role
# (Terraform output workload_role_arns). None of them may call the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feature-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jobs-worker
automountServiceAccountToken: false
