apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-api
  labels:
    app.kubernetes.io/name: feature-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: feature-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feature-api
        app.kubernetes.io/part-of: ml-platform
    spec:
      serviceAccountName: feature-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: feature-api
      containers:
        - name: feature-api
          image: mlplatform
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "--factory", "mlplatform.service.app:feature_app_from_env"]
          args: ["--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            # A mounted file, not an env var: the value stays out of the process environment (child processes, crash reports).
            - name: MLPI_REDIS_PASSWORD_FILE
              value: /var/run/secrets/mlpi/redis/password
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # The first request after start downloads the snapshot; give it time.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: snapshots
              mountPath: /var/cache/mlpi
            - name: tmp
              mountPath: /tmp
            - name: redis-auth
              mountPath: /var/run/secrets/mlpi/redis
              readOnly: true
      volumes:
        - name: redis-auth
          secret:
            secretName: redis-auth
            defaultMode: 0440
            items:
              - key: password
                path: password
        - name: snapshots
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: feature-api
  labels:
    app.kubernetes.io/name: feature-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: feature-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: feature-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: feature-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: feature-api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feature-api
