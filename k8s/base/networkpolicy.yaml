# Default: nothing may connect to pods in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# The feature API accepts traffic only from platform pods (model API, CronJob, worker).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: feature-api-from-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: feature-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ml-platform
      ports:
        - port: 8000
          protocol: TCP
---
# The model API accepts traffic from platform pods and from the ingress
# controller's namespace (labelled by the cluster operator).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: model-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ml-platform
        - namespaceSelector:
            matchLabels:
              ml-platform/ingress: "true"
      ports:
        - port: 8001
          protocol: TCP
---
# Egress is denied by default too; the policies below open only what each
# workload needs. Enforced by the VPC CNI network policy agent, which the
# Terraform enables (aws_eks_addon.vpc_cni, enableNetworkPolicy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
spec:
  podSelector: {}
  policyTypes: ["Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Platform pods (model API, CronJob) may call the feature API, and nothing else in-cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-to-feature-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ml-platform
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: feature-api
      ports:
        - port: 8000
          protocol: TCP
---
# S3 and STS (IRSA token exchange) over HTTPS. The instance metadata address
# is excluded: pods use IRSA, never the node's credentials.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-https-aws
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["feature-api", "model-api", "jobs-worker"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["169.254.169.254/32"]
      ports:
        - port: 443
          protocol: TCP
---
# Only the two Redis users may reach the Redis port, and only inside the
# private subnets (10.40.128.0/17 for the default vpc_cidr; change it with the VPC).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-redis
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["feature-api", "jobs-worker"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 10.40.128.0/17
      ports:
        - port: 6379
          protocol: TCP
