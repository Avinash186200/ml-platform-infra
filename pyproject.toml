[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlplatform"
version = "1.0.0"
description = "A small, reproducible ML platform: Terraform (AWS), Kubernetes manifests, a Dagster asset graph with data-quality gates, and a point-in-time feature API with a Redis cache."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "dagster>=1.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "redis>=5",
    "fsspec>=2024.2",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.2"]
ui = ["dagster-webserver>=1.9"]
dev = ["pytest>=8", "hypothesis>=6.100", "fakeredis[lua]>=2.23", "PyYAML>=6"]

[project.scripts]
mlplatform = "mlplatform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: the full bench rerun checked against results/ (about a minute)"]
filterwarnings = ["ignore::dagster.BetaWarning", "ignore::dagster.PreviewWarning", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"
